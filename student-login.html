<!DOCTYPE html>
<html>
<head>
    <title>SCSVMV SmartClass - Student Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
        }

        .header {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 16px;
        }

        .login-box {
            width: 350px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #34495e;
        }
    </style>
</head>

<body>

<div class="header">

    <h1>SmartClass</h1>

    <p>
        Sri Chandrasekharendra Saraswathi Viswa Mahavidyalaya
    </p>

    <p>SCSVMV</p>

</div>

<div class="login-box">

    <h2>Student Login</h2>

    <form onsubmit="return login()">

        <input
            type="text"
            id="username"
            placeholder="Enter Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

<script>

function login() {

    var username =
        document.getElementById("username").value;

    localStorage.setItem(
        "studentName",
        username
    );

    window.location.href = "home.html";

    return false;
}

</script>

</body>
</html>
