<!DOCTYPE html>
<html>
<head>
    <title>Smart Class - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-box">

        <h1>Smart Class</h1>

        <p>Welcome to Smart Class</p>

        <h3>Select Login</h3>

        <button onclick="studentLogin()">
            Student Login
        </button>

        <br><br>

        <button onclick="facultyLogin()">
            Faculty Login
        </button>

    </div>

    <script>

        function login() {

    var username =
        document.querySelector(
            'input[type="text"]'
        ).value;

    var password =
        document.querySelector(
            'input[type="password"]'
        ).value;

    if (username === "" || password === "") {

        alert("Please enter username and password.");

        return;
    }

    localStorage.setItem(
        "studentName",
        username
    );

    window.location.href = "home.html";
}


        function facultyLogin() {
            window.location.href = "faculty-login.html";
        }

    </script>

</body>
</html>
